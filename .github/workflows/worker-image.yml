name: Build bot-worker image
on:
  push:
    branches: [main]
    paths: ['bot-worker/**', '.github/workflows/worker-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: bot-worker
          push: true
          tags: ghcr.io/kumarsumit68439-code/discord-promo-hub-worker:latest
